[package]
name = "webagent"
version = "0.8.1"
edition = "2021"
description = "WebAgent — lokaler, browserbasierter Agent (Rust-Port). Web-Chats als Gehirn, lokale Shell als Werkzeug."
license = "MIT"

# Bewusst rein-Rust-Dependencies (keine windows-*/chrono/C-Toolchain nötig),
# damit der Kern plattformunabhängig ohne MSVC/MinGW baut. Zeitstempel und
# PID-Liveness liefert das Crate selbst (siehe lib.rs / run_store).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Rein-Rust-Regex MIT Lookaround-Support (die regex-Crate kann kein Lookahead/-behind).
fancy-regex = "0.14"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
lazy_static = "1.5"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "std", "local-offset", "macros"] }
tokio = { version = "1", features = ["full"] }
# Embedded WebView (wry/tao) — optional, damit der Kern ohne GUI-Deps in CI baut.
wry = { version = "0.47", optional = true }
tao = { version = "0.29", optional = true }
# Direktzugriff auf ICoreWebView2Settings, um native JS-Dialoge (alert/confirm)
# abzuschalten — die blockieren sonst die geteilte Event-Loop (siehe webview_runtime.rs).
webview2-com = { version = "0.33", optional = true }
# Win32_UI_WindowsAndMessaging + ToolHelp: die Kachelansicht sucht das
# Terminalfenster ueber die Elternkette (brain_grid.rs). Beide Module bisher nur
# durch Feature-Unification von wry vorhanden — darauf zu bauen ist Zufall, kein
# Vertrag.
windows = { version = "0.58", optional = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }
# TUI: ratatui+crossterm (Policy: windows-sys wird von crossterm gezogen, aber
# windows=0.58 ist bereits optional im Projekt; kein C-Toolchain nötig).
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
# Strukturierte Diagnose. Vom Brain-Schwarm in drei Abstimmungsrunden gefordert
# (verbesserungs-top10-2026-07 und -runde2) und bis 05.08.2026 nie eingebaut:
# 0 tracing-Treffer gegen 383 println!/eprintln!.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

[features]
default = ["webview", "tui"]
webview = ["dep:wry", "dep:tao", "dep:webview2-com", "dep:windows"]
tui = ["dep:ratatui", "dep:crossterm"]

[lib]
name = "webagent"
path = "src/lib.rs"

[[bin]]
name = "webagent"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
