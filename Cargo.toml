[package]
name = "webagent"
version = "0.11.1"
edition = "2021"
description = "WebAgent — lokaler, browserbasierter Agent (Rust-Port). Web-Chats als Gehirn, lokale Shell als Werkzeug."
license = "MIT"

# Bewusst rein-Rust-Dependencies (keine windows-*/chrono/C-Toolchain nötig),
# damit der Kern plattformunabhängig ohne MSVC/MinGW baut. Zeitstempel und
# PID-Liveness liefert das Crate selbst (siehe lib.rs / run_store).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Rein-Rust-Regex MIT Lookaround-Support (die regex-Crate kann kein Lookahead/-behind).
fancy-regex = "0.14"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
lazy_static = "1.5"
fs2 = "0.4"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "std", "local-offset", "macros"] }
tokio = { version = "1", features = ["full"] }
# T-601: HTTP/1.1 + rustls, kein reqwest, kein System-OpenSSL.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
# Embedded WebView (wry/tao) — optional, damit der Kern ohne GUI-Deps in CI baut.
wry = { version = "0.47", optional = true }
tao = { version = "0.29", optional = true }
# TUI: ratatui+crossterm (Policy: windows-sys wird von crossterm gezogen, aber
# windows=0.58 ist bereits optional im Projekt; kein C-Toolchain nötig).
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[features]
default = ["webview"]
# `webview` traegt nur die plattformfreien Crates. Die Windows-Bindings sitzen
# in der `cfg(windows)`-Sektion unten und sind dort NICHT optional: So kann
# derselbe Featurename auf Linux (WebKitGTK ueber wry) und auf Windows
# (WebView2) gelten, ohne dass Linux an windows-only Crates scheitert.
webview = ["dep:wry", "dep:tao"]
# TUI bleibt hinter ihrem Feature als Legacy-Subcommand baubar
# (docs/WEB_UI_API_TOOL_RESET.md, Phase 0 + 2), ist aber nicht mehr der
# Defaultstart. Angelegter Stand: archive/tui-ui + tui-ui-preservation-2026-09-01.
tui = ["dep:ratatui", "dep:crossterm"]

# Nur unter Windows aufgeloest — auf Linux/Android existieren diese Crates gar
# nicht, weshalb der Code sie durchgaengig hinter
# `cfg(all(windows, feature = "webview"))` fuehrt.
[target.'cfg(windows)'.dependencies]
# Direktzugriff auf ICoreWebView2Settings, um native JS-Dialoge (alert/confirm)
# abzuschalten — die blockieren sonst die geteilte Event-Loop.
webview2-com = "0.33"
# Win32_UI_WindowsAndMessaging + ToolHelp: die Kachelansicht sucht das
# Terminalfenster ueber die Elternkette (brain_grid.rs).
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
# Kimi dokumentiert Ctrl-V als den primaeren Bild-Uploadweg.  arboard setzt
# dafuer das echte Windows-Bildformat (CF_DIB) in die Zwischenablage; image
# decodiert die vom API-Client gelieferten PNG/JPEG/GIF/BMP/WebP-Bytes in RGBA.
arboard = "3.6"
clipboard-win = "5.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[lib]
name = "webagent"
path = "src/lib.rs"

[[bin]]
name = "webagent"
path = "src/main.rs"

[profile.release]
lto = true
strip = true

# Testlaeufe dominiert das LINKEN, nicht das Kompilieren: die Testbinary zieht
# wry/tao/webview2 mit voller Debug-Information, und der mingw-Linker schreibt
# jedes Mal hunderte Megabyte. Zeilennummern in Panics bleiben mit `debug = 1`
# erhalten, die Variableninformation faellt weg — die braucht hier niemand, es
# laeuft kein Debugger.
#
# `debug-assertions` bleibt an: Ueberlaufpruefungen und debug_assert! sind der
# Grund, warum ein Testlauf ueberhaupt mehr findet als ein Release-Lauf.
[profile.dev]
debug = 1
incremental = true

# Testbinary groesse: Mit dem Default (codegen-units = 256) erzeugte der
# Multi-Codegen-Build der inzwischen grossen Test-Suite ein Test-Binary, das
# beim Laden mit 0xC0000005 (ACCESS_VIOLATION) crashte — noch vor jeder
# Testausfuehrung, auch bei `--list`. Eine moderate Einheitenzahl hält das
# Binary unter der Loader-Schwelle. Verifiziert: `cargo test --lib` mit
# codegen-units = 16/1 laeuft komplett gruen (1276 passed), mit 256 crasht es.
# `[profile.test]` erbt von `[profile.dev]`, also nur codegen-units setzen.
[profile.test]
codegen-units = 16
