name: Fehlerbericht
description: Einen reproduzierbaren Fehler mit commitgebundener Evidenz melden
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Das Repository ist öffentlich. Keine Credentials, Cookies, privaten Transkripte, Browserprofile oder unbereinigten Laufzeitdaten einfügen.
  - type: input
    id: revision
    attributes:
      label: Commit oder Version
      placeholder: git rev-parse HEAD oder veröffentlichte Version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduktion
      description: Minimale, nummerierte Schritte ohne geheime oder personenbezogene Daten.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Bereinigte Evidenz
      description: Fehlertext, Testname oder kleiner Logauszug; Geheimnisse und lokale Pfade entfernen.
  - type: textarea
    id: environment
    attributes:
      label: Umgebung
      placeholder: Betriebssystem, Rust-Version, Features, Browser/WebView2 falls relevant
    validations:
      required: true
  - type: dropdown
    id: live_provider
    attributes:
      label: Betrifft der Fehler einen Live-Provider oder Login?
      options:
        - Nein
        - Ja; Reproduktion erfordert vorab Eigentümerfreigabe
    validations:
      required: true
