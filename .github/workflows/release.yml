name: release

# Release-Binaries an Tag v* (z.B. v0.9.0).
# Windows: volle Features + WebView2Loader.dll
# Linux / Android: Session-TUI + CLI ohne Embedded WebView
#   (WebView2 und webview2-com sind Windows-only).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Copy WebView2Loader.dll
        shell: pwsh
        run: pwsh -File scripts/copy-webview2-loader.ps1 -Profile release

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\webagent.exe dist\webagent-windows-x86_64.exe
          if (Test-Path target\release\WebView2Loader.dll) {
            Copy-Item target\release\WebView2Loader.dll dist\WebView2Loader.dll
          }
          Get-FileHash dist\webagent-windows-x86_64.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  webagent-windows-x86_64.exe" } |
            Set-Content -NoNewline dist\webagent-windows-x86_64.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  linux:
    name: linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release (TUI, no WebView)
        run: cargo build --release --no-default-features --features tui

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/webagent dist/webagent-linux-x86_64
          strip dist/webagent-linux-x86_64
          (cd dist && sha256sum webagent-linux-x86_64 > webagent-linux-x86_64.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*

  android:
    name: android-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Termux binary
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo build --release --target aarch64-linux-android --no-default-features --features tui

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/webagent dist/webagent-aarch64-linux-android
          (cd dist && sha256sum webagent-aarch64-linux-android > webagent-aarch64-linux-android.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: android-aarch64
          path: dist/*

  publish:
    name: github-release
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/webagent-windows-x86_64.exe
            artifacts/webagent-windows-x86_64.exe.sha256
            artifacts/WebView2Loader.dll
            artifacts/webagent-linux-x86_64
            artifacts/webagent-linux-x86_64.sha256
            artifacts/webagent-aarch64-linux-android
            artifacts/webagent-aarch64-linux-android.sha256
