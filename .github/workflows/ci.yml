name: CI

on:
  push:
  pull_request:

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Build
        run: cargo build --no-default-features --verbose
      - name: Test
        run: cargo test --no-default-features --verbose
        # Kern-Unit-Tests ohne Embedded WebView (kein GTK/WebView2 in CI).

  linux-webview:
    name: build (Linux, WebView via WebKitGTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      # wry nutzt unter Linux WebKitGTK statt WebView2. Ohne diese Pakete
      # scheitert schon das Kompilieren, nicht erst der Start.
      - name: WebKitGTK-Abhaengigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev pkg-config
      # Eigener Job, damit ein Bruch der Linux-WebView-Variante hier auffaellt
      # und nicht erst beim Release-Tag. Bauen genuegt: Ein WebView laesst sich
      # ohne Anzeige nicht sinnvoll starten, und ein gruener Testlauf wuerde
      # eine Funktionsfaehigkeit behaupten, die er nicht geprueft hat.
      - name: Build (tui + webview)
        run: cargo build --no-default-features --features tui,webview --verbose

  windows:
    name: build & test (Windows, volle Features)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Warum dieser Job existiert:
      #
      # Der Linux-Job baut mit `--no-default-features`, also OHNE `webview` und
      # `tui`. Damit blieb der gesamte Windows-Pfad — WebView2, Job-Objekte,
      # Konsolen-Setup, die TUI — von jeder Pipeline ungeprueft; er lief nur auf
      # Storax' Rechner. Genau in dieser Luecke steckte am 30.07.2026 ein Fehler,
      # den niemand sah: `time` war ohne das `macros`-Feature deklariert und der
      # lokale Build nur deshalb gruen, weil `wry`/`tao` es transitiv mitzogen.
      # Umgekehrt kann jetzt auch der Windows-Pfad brechen, ohne dass es
      # auffaellt — dieser Job schliesst die andere Haelfte.
      #
      # `windows-latest` hat WebView2 vorinstalliert; die Tests brauchen keinen
      # echten Browserstart, sie pruefen Logik und Selektor-Aufloesung.
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (volle Features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (volle Features)
        run: cargo build --verbose
      - name: Test (volle Features)
        run: cargo test --lib --verbose
