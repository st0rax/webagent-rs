[package]
name = "webagent-transport"
version = "0.11.10"
edition = "2021"
license = "MIT"

[lib]
name = "webagent_transport"
path = "src/lib.rs"

[dependencies]
webagent-core = { path = "../webagent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "std", "local-offset", "macros"] }
regex = "1"
fancy-regex = "0.14"
lazy_static = "1.5"

[features]
# GUI dependencies stay optional so `--no-default-features` builds without wry.
webview = [
    "webagent-core/webview",
    "dep:wry",
    "dep:tao",
    "dep:webview2-com",
    "dep:windows",
    "dep:arboard",
    "dep:clipboard-win",
    "dep:image",
]
# Root-crate tests use the geometry helpers defined under cfg(test) here.
test-support = []

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.33", optional = true }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"], optional = true }
arboard = { version = "3.6", optional = true }
clipboard-win = { version = "5.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"], optional = true }

[dependencies.wry]
version = "0.47"
optional = true

[dependencies.tao]
version = "0.29"
optional = true
