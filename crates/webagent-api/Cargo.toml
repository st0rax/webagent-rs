[package]
name = "webagent-api"
version = "0.11.9"
edition = "2021"
license = "MIT"

[lib]
name = "webagent_api"
path = "src/lib.rs"

[dependencies]
webagent-core = { path = "../webagent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "std", "local-offset", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
