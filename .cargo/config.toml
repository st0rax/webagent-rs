# Die aktive Toolchain hier ist x86_64-pc-windows-gnu.
# Rust liefert die passenden MinGW-Libs selbst; link-self-contained weist den Linker darauf hin.
# WebView2 muss auf dem Windows-Main-Thread bleiben. Die PE-Stackreserve verhindert einen Main-Stack-Ueberlauf.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-self-contained=yes", "-C", "link-arg=-Wl,--stack=67108864"]
